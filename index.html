<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集團 AI 應用案例 · Primax AI Cases</title>
<style>
  /* =========================================================
     Design Tokens — Primax AI Empowerment palette
     ========================================================= */
  :root {
    --bg-page: #F5F7FA;
    --bg-card: #FFFFFF;
    --bg-card-hover: #FAFBFC;
    --bg-modal-backdrop: rgba(13, 51, 56, 0.72);
    --bg-section-alt: #F0F4F6;

    --color-primary: #008C9A;        /* Primax teal */
    --color-primary-dark: #0D3338;
    --color-primary-light: #E6F4F5;
    --color-accent: #FF8C42;         /* Benefits highlight */
    --color-accent-light: #FFF1E6;
    --color-danger: #D14545;
    --color-danger-light: #FCE9E9;
    --color-success: #2D9C5A;
    --color-success-light: #E5F5EC;

    --text-primary: #1F2D33;
    --text-secondary: #4F6670;
    --text-muted: #8A9AA3;
    --text-on-primary: #FFFFFF;

    --border: #E1E5EA;
    --border-strong: #C8D0D6;

    --shadow-card: 0 1px 3px rgba(13, 51, 56, 0.06), 0 1px 2px rgba(13, 51, 56, 0.04);
    --shadow-card-hover: 0 8px 24px rgba(13, 51, 56, 0.12), 0 2px 6px rgba(13, 51, 56, 0.08);
    --shadow-modal: 0 24px 64px rgba(13, 51, 56, 0.24);

    --radius-card: 12px;
    --radius-pill: 999px;
    --radius-modal: 16px;

    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei",
                 "PingFang TC", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--font-body);
    background: var(--bg-page);
    color: var(--text-primary);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* =========================================================
     Page Header
     ========================================================= */
  .page-header {
    background: linear-gradient(135deg, #0D3338 0%, #008C9A 100%);
    color: var(--text-on-primary);
    padding: 48px 32px 56px;
  }
  .page-header__inner {
    max-width: 1280px;
    margin: 0 auto;
  }
  .page-header__eyebrow {
    display: inline-block;
    padding: 4px 12px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: var(--radius-pill);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0.9;
  }
  .page-header__title {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .page-header__subtitle {
    font-size: 16px;
    opacity: 0.85;
    margin: 0 0 24px;
    max-width: 760px;
  }
  .page-header__meta {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 13px;
    opacity: 0.8;
  }
  .page-header__meta span::before {
    content: "●";
    color: var(--color-accent);
    margin-right: 8px;
  }
  .preview-banner {
    background: rgba(255, 140, 66, 0.15);
    border: 1px solid rgba(255, 140, 66, 0.4);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    margin-top: 14px;
    display: inline-block;
  }

  /* =========================================================
     Filter Bar
     ========================================================= */
  .filter-bar {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 32px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-bar__label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 600;
    margin-right: 4px;
    min-width: 60px;
  }
  .filter-chip {
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .filter-chip:hover {
    border-color: var(--color-primary);
    color: var(--color-primary);
  }
  .filter-chip.is-active {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--text-on-primary);
  }
  .filter-bar__search {
    margin-left: auto;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    width: 240px;
    font-family: inherit;
    background: var(--bg-card);
  }
  .filter-bar__search:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-light);
  }

  /* =========================================================
     Cards Grid (Tier 1)
     ========================================================= */
  .cases-grid {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 32px 64px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }
  .case-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 24px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    text-align: left;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .case-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--color-primary);
  }
  .case-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--color-primary);
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-2px);
  }
  .case-card__header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .case-card__badge {
    display: inline-block;
    padding: 3px 10px;
    background: var(--color-primary-light);
    color: var(--color-primary);
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .stage-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: var(--radius-pill);
    font-size: 11px;
    font-weight: 600;
  }
  .stage-badge.stage-live { background: var(--color-success-light); color: var(--color-success); }
  .stage-badge.stage-mvp { background: var(--color-accent-light); color: var(--color-accent); }
  .stage-badge.stage-poc { background: #FFF7DB; color: #B58A00; }
  .stage-badge.stage-other { background: var(--border); color: var(--text-secondary); }
  .case-card__title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
    margin: 0 0 14px;
    color: var(--text-primary);
    min-height: 44px;
  }
  .case-card__row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .case-card__row-label {
    color: var(--text-muted);
    font-weight: 600;
    flex-shrink: 0;
    width: 50px;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding-top: 2px;
  }
  .case-card__row-value {
    color: var(--text-secondary);
    flex: 1;
    line-height: 1.5;
  }
  .case-card__owner {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    margin-bottom: 12px;
  }
  .case-card__owner::before {
    content: "👤 ";
  }
  .case-card__benefits {
    margin-top: auto;
    background: var(--color-accent-light);
    margin-left: -24px;
    margin-right: -24px;
    margin-bottom: -24px;
    padding: 12px 24px 16px;
    border-bottom-left-radius: var(--radius-card);
    border-bottom-right-radius: var(--radius-card);
  }
  .case-card__benefits-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--color-accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .case-card__benefits-value {
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 500;
    line-height: 1.5;
  }

  /* =========================================================
     Modal
     ========================================================= */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: var(--bg-modal-backdrop);
    display: none;
    align-items: flex-start;
    justify-content: center;
    z-index: 1000;
    overflow-y: auto;
    padding: 40px 20px;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.is-open { display: flex; }
  .modal {
    background: var(--bg-card);
    border-radius: var(--radius-modal);
    max-width: 960px;
    width: 100%;
    box-shadow: var(--shadow-modal);
    overflow: hidden;
    animation: modal-in 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    margin-bottom: 40px;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal__header {
    background: linear-gradient(135deg, #0D3338 0%, #008C9A 100%);
    color: var(--text-on-primary);
    padding: 28px 32px 24px;
    position: relative;
  }
  .modal__close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal__close:hover { background: rgba(255, 255, 255, 0.28); }
  .modal__badges { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .modal__badge {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .modal__title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 8px;
    padding-right: 56px;
    line-height: 1.4;
  }
  .modal__tools { font-size: 13px; opacity: 0.85; }
  .modal__tools::before { content: "🛠 "; margin-right: 4px; }
  .modal__body { padding: 28px 32px 32px; }

  /* Before / After grid */
  .ba-section { margin-bottom: 28px; }
  .ba-section__title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ba-section__title::before {
    content: "⇄";
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--color-primary-light);
    color: var(--color-primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .ba-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .ba-col {
    border-radius: 12px;
    padding: 16px 18px;
  }
  .ba-col--before {
    background: var(--color-danger-light);
    border-left: 3px solid var(--color-danger);
  }
  .ba-col--after {
    background: var(--color-success-light);
    border-left: 3px solid var(--color-success);
  }
  .ba-col__label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .ba-col--before .ba-col__label { color: var(--color-danger); }
  .ba-col--after .ba-col__label { color: var(--color-success); }
  .ba-col__how {
    font-size: 13px;
    color: var(--text-primary);
    margin-bottom: 10px;
    line-height: 1.55;
  }
  .ba-col__pain, .ba-col__outcome {
    font-size: 12px;
    color: var(--text-secondary);
    padding-top: 10px;
    border-top: 1px dashed rgba(0,0,0,0.1);
    line-height: 1.5;
  }

  /* IPO sections */
  .ipo-section { margin-bottom: 22px; }
  .ipo-section__heading {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .ipo-section__icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--color-primary-light);
    color: var(--color-primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .ipo-section__title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
  }
  .ipo-section__body {
    padding-left: 38px;
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.65;
  }
  .ipo-section__body p { margin: 0 0 6px; }
  .ipo-section__body ul { margin: 0; padding-left: 18px; }
  .ipo-section__body li { margin-bottom: 3px; }

  .ipo-section--benefits .ipo-section__icon {
    background: var(--color-accent-light);
    color: var(--color-accent);
  }
  .ipo-section--benefits .ipo-section__body {
    background: var(--color-accent-light);
    margin-left: 38px;
    padding: 12px 16px;
    border-radius: 10px;
    border-left: 3px solid var(--color-accent);
    color: var(--text-primary);
    font-weight: 500;
  }

  /* Build Story */
  .build-story {
    background: #F0F4F6;
    border-radius: 12px;
    padding: 16px 20px;
    margin: 22px 0;
  }
  .build-story__label {
    font-size: 11px;
    font-weight: 700;
    color: var(--color-primary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .build-story__body {
    font-size: 13px;
    color: var(--text-primary);
    line-height: 1.65;
  }

  /* Owner card + Quote */
  .owner-card {
    background: linear-gradient(135deg, #F0F4F6 0%, #E6F4F5 100%);
    border-radius: 12px;
    padding: 18px 20px;
    margin: 22px 0;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .owner-card__avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--color-primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    flex-shrink: 0;
  }
  .owner-card__meta { flex: 1; }
  .owner-card__name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 2px;
  }
  .owner-card__role {
    font-size: 12px;
    color: var(--text-secondary);
  }
  .owner-card__bg {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.5;
  }
  .quote-block {
    background: var(--color-primary-light);
    border-left: 4px solid var(--color-primary);
    padding: 14px 18px;
    margin: 20px 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-primary);
    font-style: italic;
    border-radius: 0 8px 8px 0;
  }
  .quote-block::before { content: "“"; font-size: 32px; color: var(--color-primary); line-height: 0; vertical-align: -10px; margin-right: 4px; }
  .quote-block::after { content: "”"; font-size: 32px; color: var(--color-primary); line-height: 0; vertical-align: -10px; margin-left: 4px; }

  /* Modal footer */
  .modal__footer {
    border-top: 1px solid var(--border);
    background: var(--bg-section-alt);
    padding: 14px 32px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .modal__footer__src { max-width: 60%; }

  /* Empty state */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 24px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .page-header { padding: 32px 20px 40px; }
    .page-header__title { font-size: 24px; }
    .cases-grid { padding: 20px 16px 48px; gap: 16px; grid-template-columns: 1fr; }
    .filter-bar { padding: 20px 16px 0; }
    .filter-bar__search { width: 100%; margin-left: 0; }
    .ba-grid { grid-template-columns: 1fr; }
    .modal__body { padding: 20px 20px 24px; }
    .modal__title { font-size: 18px; }
    .ipo-section__body { padding-left: 0; }
    .ipo-section--benefits .ipo-section__body { margin-left: 0; }
  }

  @media print {
    .page-header, .filter-bar { background: white; color: black; }
    .case-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
    .modal-backdrop { display: none !important; }
  }
</style>
</head>
<body>

<header class="page-header">
  <div class="page-header__inner">
    <span class="page-header__eyebrow">Primax · AI Empowerment</span>
    <h1 class="page-header__title">集團 AI 應用案例庫</h1>
    <p class="page-header__subtitle">
      Group AI / RPA Use Cases — 點擊卡片查看完整 Before/After、IPO 流程、Owner 介紹與第一手分享。
    </p>
    <div class="page-header__meta">
      <span id="meta-count">案例總數：—</span>
      <span id="meta-updated">更新日期：—</span>
      <span>維護：DTO Office</span>
    </div>
    <div class="preview-banner" id="preview-banner" style="display:none">
      ⚠️ Internal Preview — 含 Active-Internal 草稿，正式公開請等 Active-Published
    </div>
  </div>
</header>

<div class="filter-bar" id="filter-bar">
  <div class="filter-row" id="filter-row-bg">
    <span class="filter-bar__label">部門 / BG：</span>
  </div>
  <div class="filter-row" id="filter-row-stage">
    <span class="filter-bar__label">階段：</span>
    <input type="search" class="filter-bar__search" id="search-input" placeholder="搜尋案例 / 工具 / 效益 / Owner..." />
  </div>
</div>

<main class="cases-grid" id="cases-grid">
  <div class="empty-state">載入中…</div>
</main>

<div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal" id="modal">
    <header class="modal__header">
      <button class="modal__close" id="modal-close" aria-label="關閉">×</button>
      <div class="modal__badges" id="modal-badges"></div>
      <h2 class="modal__title" id="modal-title"></h2>
      <div class="modal__tools" id="modal-tools"></div>
    </header>
    <div class="modal__body" id="modal-body"></div>
    <footer class="modal__footer">
      <span class="modal__footer__src">案例編號：<span id="modal-id">—</span> · 來源：<span id="modal-src">—</span></span>
      <span>最後更新：<span id="modal-updated">—</span></span>
    </footer>
  </div>
</div>

<script>
/* =====================================================================
   DATA — fetched from cases.json (generated by excel_to_json.py)
   ===================================================================== */
let ALL_CASES = [];
let META = {};

const gridEl = document.getElementById("cases-grid");
const filterRowBg = document.getElementById("filter-row-bg");
const filterRowStage = document.getElementById("filter-row-stage");
const searchEl = document.getElementById("search-input");
const metaCount = document.getElementById("meta-count");
const metaUpdated = document.getElementById("meta-updated");
const previewBanner = document.getElementById("preview-banner");

const state = { bg: "ALL", stage: "ALL", search: "" };

async function init() {
  try {
    const resp = await fetch("cases.json", { cache: "no-store" });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const payload = await resp.json();
    META = payload;
    ALL_CASES = payload.cases || [];
    metaUpdated.textContent = `更新日期：${payload.generated_at?.slice(0, 10) || "—"}`;
    if (payload.mode !== "published") {
      previewBanner.style.display = "inline-block";
      previewBanner.textContent = `⚠️ ${payload.mode === "internal" ? "Internal Preview" : "Admin Full View"} — ${payload.exported}/${payload.total_in_ssot} 案 (含未公開草稿)`;
    }
    renderFilters();
    renderCards();
    checkDeepLink();
  } catch (err) {
    gridEl.innerHTML = `<div class="empty-state">❌ 載入失敗：${err.message}<br><small>請確認 cases.json 存在</small></div>`;
  }
}

function stageClass(stage) {
  if (!stage) return "stage-other";
  if (stage.includes("上線") || stage.includes("穩定運行") || stage.includes("已落地") || stage.includes("Deployment")) return "stage-live";
  if (stage.includes("MVP")) return "stage-mvp";
  if (stage.includes("POC") || stage.includes("PoC")) return "stage-poc";
  return "stage-other";
}

function stageBucket(stage) {
  if (!stage) return "其他";
  if (stage.includes("上線") || stage.includes("穩定運行") || stage.includes("Deployment") || stage.includes("已落地") || stage.includes("已完成")) return "已上線";
  if (stage.includes("MVP")) return "MVP";
  if (stage.includes("POC") || stage.includes("PoC") || stage.includes("Pilot")) return "POC";
  if (stage.includes("結案")) return "結案-未確認";
  if (stage.includes("規劃") || stage.includes("需求") || stage.includes("評估")) return "規劃/評估";
  if (stage.includes("卡")) return "卡點";
  return "其他";
}

function renderFilters() {
  // BG chips
  const bgs = ["ALL", ...Array.from(new Set(ALL_CASES.map(c => c.bg))).sort()];
  bgs.forEach(bg => {
    const chip = document.createElement("button");
    chip.className = "filter-chip" + (bg === "ALL" ? " is-active" : "");
    chip.textContent = bg === "ALL" ? `全部 (${ALL_CASES.length})` : bg;
    chip.dataset.bg = bg;
    chip.onclick = () => {
      state.bg = bg;
      filterRowBg.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("is-active"));
      chip.classList.add("is-active");
      renderCards();
    };
    filterRowBg.appendChild(chip);
  });

  // Stage chips
  const buckets = ["ALL", "已上線", "MVP", "POC", "結案-未確認", "規劃/評估", "卡點", "其他"];
  buckets.forEach(stage => {
    const count = stage === "ALL" ? ALL_CASES.length : ALL_CASES.filter(c => stageBucket(c.stage) === stage).length;
    if (stage !== "ALL" && count === 0) return;
    const chip = document.createElement("button");
    chip.className = "filter-chip" + (stage === "ALL" ? " is-active" : "");
    chip.textContent = `${stage === "ALL" ? "全部" : stage} (${count})`;
    chip.dataset.stage = stage;
    chip.onclick = () => {
      state.stage = stage;
      filterRowStage.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("is-active"));
      chip.classList.add("is-active");
      renderCards();
    };
    filterRowStage.insertBefore(chip, searchEl);
  });
}

function matchesFilter(c) {
  if (state.bg !== "ALL" && c.bg !== state.bg) return false;
  if (state.stage !== "ALL" && stageBucket(c.stage) !== state.stage) return false;
  if (state.search) {
    const q = state.search.toLowerCase();
    const hay = [c.bg, c.title, c.tools, c.benefits_summary, c.owner_name, c.stage].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function renderCards() {
  const visible = ALL_CASES.filter(matchesFilter);
  gridEl.innerHTML = "";
  metaCount.textContent = `案例總數：${visible.length} / ${ALL_CASES.length}`;
  if (visible.length === 0) {
    gridEl.innerHTML = '<div class="empty-state">沒有符合條件的案例</div>';
    return;
  }
  visible.forEach(c => {
    const card = document.createElement("button");
    card.className = "case-card";
    card.type = "button";
    card.setAttribute("aria-label", `查看 ${c.bg} ${c.title} 詳情`);
    const ownerHtml = c.owner_name ? `<div class="case-card__owner">${escape(c.owner_name)}${c.owner_dept ? " · " + escape(c.owner_dept) : ""}</div>` : "";
    card.innerHTML = `
      <div class="case-card__header">
        <span class="case-card__badge">${escape(c.bg)}</span>
        ${c.stage ? `<span class="stage-badge ${stageClass(c.stage)}">${escape(stageBucket(c.stage))}</span>` : ""}
      </div>
      <h3 class="case-card__title">${escape(c.title)}</h3>
      <div class="case-card__row">
        <span class="case-card__row-label">Tools</span>
        <span class="case-card__row-value">${escape(c.tools || "—")}</span>
      </div>
      ${ownerHtml}
      <div class="case-card__benefits">
        <div class="case-card__benefits-label">效益亮點</div>
        <div class="case-card__benefits-value">${escape(c.benefits_summary || "—")}</div>
      </div>
    `;
    card.onclick = () => openModal(c.id);
    gridEl.appendChild(card);
  });
}

function escape(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
}

/* =====================================================================
   MODAL
   ===================================================================== */
const backdrop = document.getElementById("modal-backdrop");
const closeBtn = document.getElementById("modal-close");

function openModal(id) {
  const c = ALL_CASES.find(x => x.id === id);
  if (!c) return;

  const badges = document.getElementById("modal-badges");
  badges.innerHTML = `
    <span class="modal__badge">${escape(c.bg)}</span>
    ${c.stage ? `<span class="modal__badge">${escape(c.stage)}</span>` : ""}
    ${c.category_matrix ? `<span class="modal__badge">${escape(c.category_matrix)}</span>` : ""}
  `;
  document.getElementById("modal-title").textContent = c.title || "";
  document.getElementById("modal-tools").textContent = c.tools || "";
  document.getElementById("modal-id").textContent = (c.id || "—").toUpperCase();
  document.getElementById("modal-src").textContent = c.source_meeting || "—";
  document.getElementById("modal-updated").textContent = c.last_updated || "—";

  const body = document.getElementById("modal-body");
  const parts = [];

  if (c.pain_point) {
    parts.push(renderSection("①", "痛點與情境", `<p>${escape(c.pain_point)}</p>`));
  }

  if (c.before_how || c.after_how) {
    parts.push(`
      <section class="ba-section">
        <h4 class="ba-section__title">Before / After 對比</h4>
        <div class="ba-grid">
          <div class="ba-col ba-col--before">
            <div class="ba-col__label">Before · 導入前</div>
            ${c.before_how ? `<div class="ba-col__how">${escape(c.before_how)}</div>` : ""}
            ${c.before_pain ? `<div class="ba-col__pain"><strong>痛點：</strong>${escape(c.before_pain)}</div>` : ""}
          </div>
          <div class="ba-col ba-col--after">
            <div class="ba-col__label">After · 導入後</div>
            ${c.after_how ? `<div class="ba-col__how">${escape(c.after_how)}</div>` : ""}
            ${c.after_outcome ? `<div class="ba-col__outcome"><strong>結果：</strong>${escape(c.after_outcome)}</div>` : ""}
          </div>
        </div>
      </section>
    `);
  }

  if (c.input && c.input.length) parts.push(renderSection("②", "Input · 資料來源", renderList(c.input)));
  if (c.process && c.process.length) parts.push(renderSection("③", "Process · 處理流程", renderList(c.process)));
  if (c.output && c.output.length) parts.push(renderSection("④", "Output · 產出形式", renderList(c.output)));
  if (c.benefits && c.benefits.length) parts.push(renderSection("⑤", "Benefits · 實際效益", renderList(c.benefits), "benefits"));

  if (c.build_story) {
    parts.push(`
      <div class="build-story">
        <div class="build-story__label">⚙ 怎麼做出來的</div>
        <div class="build-story__body">${escape(c.build_story)}</div>
      </div>
    `);
  }

  if (c.owner_name) {
    const initials = (c.owner_name || "?").trim().charAt(0).toUpperCase();
    parts.push(`
      <div class="owner-card">
        <div class="owner-card__avatar">${escape(initials)}</div>
        <div class="owner-card__meta">
          <div class="owner-card__name">${escape(c.owner_name)}</div>
          <div class="owner-card__role">${escape(c.owner_role || "—")}${c.owner_dept ? " · " + escape(c.owner_dept) : ""}</div>
          ${c.owner_background ? `<div class="owner-card__bg">${escape(c.owner_background)}</div>` : ""}
          ${c.owner_email ? `<div class="owner-card__bg">📧 ${escape(c.owner_email)}</div>` : ""}
        </div>
      </div>
    `);
  }

  if (c.quote) {
    parts.push(`<div class="quote-block">${escape(c.quote)}</div>`);
  }

  body.innerHTML = parts.join("");

  backdrop.classList.add("is-open");
  document.body.style.overflow = "hidden";
  history.replaceState(null, "", `#case=${c.id}`);
}

function renderSection(icon, title, content, variant = "") {
  return `
    <section class="ipo-section ${variant ? "ipo-section--" + variant : ""}">
      <div class="ipo-section__heading">
        <span class="ipo-section__icon">${icon}</span>
        <h4 class="ipo-section__title">${title}</h4>
      </div>
      <div class="ipo-section__body">${content}</div>
    </section>
  `;
}

function renderList(items) {
  if (typeof items === "string") return `<p>${escape(items)}</p>`;
  return "<ul>" + items.map(i => `<li>${escape(i)}</li>`).join("") + "</ul>";
}

function closeModal() {
  backdrop.classList.remove("is-open");
  document.body.style.overflow = "";
  history.replaceState(null, "", window.location.pathname + window.location.search);
}

closeBtn.onclick = closeModal;
backdrop.onclick = e => { if (e.target === backdrop) closeModal(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && backdrop.classList.contains("is-open")) closeModal();
});

searchEl.addEventListener("input", () => {
  state.search = searchEl.value.trim();
  renderCards();
});

function checkDeepLink() {
  const hash = window.location.hash.match(/case=([\w-]+)/);
  if (hash) openModal(hash[1]);
}

init();
</script>

</body>
</html>
