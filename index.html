<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集團 AI 應用案例 · Primax AI Cases</title>
<style>
  /* =========================================================
     Design Tokens — Primax AI Empowerment palette
     ========================================================= */
  :root {
    --bg-page: #F5F7FA;
    --bg-card: #FFFFFF;
    --bg-card-hover: #FAFBFC;
    --bg-modal-backdrop: rgba(13, 51, 56, 0.72);
    --bg-section-alt: #F0F4F6;

    --color-primary: #008C9A;        /* Primax teal */
    --color-primary-dark: #0D3338;
    --color-primary-light: #E6F4F5;
    --color-accent: #FF8C42;         /* Benefits highlight */
    --color-accent-light: #FFF1E6;

    --text-primary: #1F2D33;
    --text-secondary: #4F6670;
    --text-muted: #8A9AA3;
    --text-on-primary: #FFFFFF;

    --border: #E1E5EA;
    --border-strong: #C8D0D6;

    --shadow-card: 0 1px 3px rgba(13, 51, 56, 0.06), 0 1px 2px rgba(13, 51, 56, 0.04);
    --shadow-card-hover: 0 8px 24px rgba(13, 51, 56, 0.12), 0 2px 6px rgba(13, 51, 56, 0.08);
    --shadow-modal: 0 24px 64px rgba(13, 51, 56, 0.24);

    --radius-card: 12px;
    --radius-pill: 999px;
    --radius-modal: 16px;

    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei",
                 "PingFang TC", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--font-body);
    background: var(--bg-page);
    color: var(--text-primary);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* =========================================================
     Page Header
     ========================================================= */
  .page-header {
    background: linear-gradient(135deg, #0D3338 0%, #008C9A 100%);
    color: var(--text-on-primary);
    padding: 48px 32px 56px;
  }
  .page-header__inner {
    max-width: 1280px;
    margin: 0 auto;
  }
  .page-header__eyebrow {
    display: inline-block;
    padding: 4px 12px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: var(--radius-pill);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0.9;
  }
  .page-header__title {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .page-header__subtitle {
    font-size: 16px;
    opacity: 0.85;
    margin: 0 0 24px;
    max-width: 760px;
  }
  .page-header__meta {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 13px;
    opacity: 0.8;
  }
  .page-header__meta span::before {
    content: "●";
    color: var(--color-accent);
    margin-right: 8px;
  }

  /* =========================================================
     Filter Bar
     ========================================================= */
  .filter-bar {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 32px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .filter-bar__label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 600;
  }
  .filter-chip {
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .filter-chip:hover {
    border-color: var(--color-primary);
    color: var(--color-primary);
  }
  .filter-chip.is-active {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--text-on-primary);
  }
  .filter-bar__search {
    margin-left: auto;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    width: 240px;
    font-family: inherit;
    background: var(--bg-card);
  }
  .filter-bar__search:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-light);
  }

  /* =========================================================
     Cards Grid (Tier 1)
     ========================================================= */
  .cases-grid {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 32px 64px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .case-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 24px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    text-align: left;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .case-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--color-primary);
  }
  .case-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--color-primary);
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-2px);
  }
  .case-card__header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .case-card__badge {
    display: inline-block;
    padding: 3px 10px;
    background: var(--color-primary-light);
    color: var(--color-primary);
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .case-card__id {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .case-card__title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
    margin: 0 0 16px;
    color: var(--text-primary);
    min-height: 44px;
  }
  .case-card__row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .case-card__row-label {
    color: var(--text-muted);
    font-weight: 600;
    flex-shrink: 0;
    width: 50px;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding-top: 2px;
  }
  .case-card__row-value {
    color: var(--text-secondary);
    flex: 1;
    line-height: 1.5;
  }
  .case-card__benefits {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    background: var(--color-accent-light);
    margin-left: -24px;
    margin-right: -24px;
    margin-bottom: -24px;
    padding: 12px 24px 16px;
    border-bottom-left-radius: var(--radius-card);
    border-bottom-right-radius: var(--radius-card);
  }
  .case-card__benefits-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--color-accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .case-card__benefits-value {
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 500;
    line-height: 1.5;
  }
  .case-card__cta {
    position: absolute;
    bottom: 12px;
    right: 16px;
    color: var(--color-primary);
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    transform: translateX(-4px);
    transition: all 0.2s ease;
  }
  .case-card:hover .case-card__cta {
    opacity: 1;
    transform: translateX(0);
  }

  /* =========================================================
     Modal (Tier 2 — IPO detail)
     ========================================================= */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: var(--bg-modal-backdrop);
    display: none;
    align-items: flex-start;
    justify-content: center;
    z-index: 1000;
    overflow-y: auto;
    padding: 40px 20px;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.is-open {
    display: flex;
  }
  .modal {
    background: var(--bg-card);
    border-radius: var(--radius-modal);
    max-width: 880px;
    width: 100%;
    box-shadow: var(--shadow-modal);
    overflow: hidden;
    animation: modal-in 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    margin-bottom: 40px;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal__header {
    background: linear-gradient(135deg, #0D3338 0%, #008C9A 100%);
    color: var(--text-on-primary);
    padding: 28px 32px 24px;
    position: relative;
  }
  .modal__close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  .modal__close:hover {
    background: rgba(255, 255, 255, 0.28);
  }
  .modal__badge {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .modal__title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 8px;
    padding-right: 56px;
    line-height: 1.4;
  }
  .modal__tools {
    font-size: 13px;
    opacity: 0.85;
  }
  .modal__tools::before {
    content: "🛠 ";
    margin-right: 4px;
  }

  .modal__body {
    padding: 28px 32px 32px;
  }

  .ipo-section {
    margin-bottom: 24px;
  }
  .ipo-section:last-child {
    margin-bottom: 0;
  }
  .ipo-section__heading {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .ipo-section__icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--color-primary-light);
    color: var(--color-primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .ipo-section__title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
  }
  .ipo-section__body {
    padding-left: 38px;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.7;
  }
  .ipo-section__body p {
    margin: 0 0 8px;
  }
  .ipo-section__body ul {
    margin: 0;
    padding-left: 18px;
  }
  .ipo-section__body li {
    margin-bottom: 4px;
  }

  /* Benefits section uses accent color */
  .ipo-section--benefits .ipo-section__icon {
    background: var(--color-accent-light);
    color: var(--color-accent);
  }
  .ipo-section--benefits .ipo-section__body {
    background: var(--color-accent-light);
    margin-left: 38px;
    padding: 14px 18px;
    border-radius: 10px;
    border-left: 3px solid var(--color-accent);
    color: var(--text-primary);
    font-weight: 500;
  }

  /* Footer of modal */
  .modal__footer {
    border-top: 1px solid var(--border);
    background: var(--bg-section-alt);
    padding: 14px 32px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* =========================================================
     Empty state
     ========================================================= */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 24px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* =========================================================
     Responsive
     ========================================================= */
  @media (max-width: 640px) {
    .page-header { padding: 32px 20px 40px; }
    .page-header__title { font-size: 24px; }
    .cases-grid { padding: 20px 16px 48px; gap: 16px; }
    .filter-bar { padding: 20px 16px 0; }
    .filter-bar__search { width: 100%; margin-left: 0; }
    .modal { margin-bottom: 20px; }
    .modal__header { padding: 24px 20px 20px; }
    .modal__title { font-size: 18px; }
    .modal__body { padding: 20px 20px 24px; }
    .ipo-section__body { padding-left: 0; }
    .ipo-section--benefits .ipo-section__body { margin-left: 0; }
  }

  /* Print styles — for if anyone wants to PDF this */
  @media print {
    .page-header, .filter-bar { background: white; color: black; }
    .case-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
    .modal-backdrop { display: none !important; }
  }
</style>
</head>
<body>

<!-- ============================================================
     PAGE HEADER
     ============================================================ -->
<header class="page-header">
  <div class="page-header__inner">
    <span class="page-header__eyebrow">Primax · AI Empowerment</span>

    <p class="page-header__subtitle">
      Group AI Use Cases — 各部門已落地的 AI 應用，點擊卡片查看完整 IPO（Input · Process · Output）與實際效益。
    </p>
    <div class="page-header__meta">
      <span id="meta-count">案例總數：—</span>
      <span>更新日期：2026-05-18</span>

    </div>
  </div>
</header>

<!-- ============================================================
     FILTER BAR
     ============================================================ -->
<div class="filter-bar" id="filter-bar">
  <span class="filter-bar__label">部門 / BG：</span>
  <!-- Filter chips injected by JS -->
  <input type="search" class="filter-bar__search" id="search-input" placeholder="搜尋案例 / 工具 / 效益..." />
</div>

<!-- ============================================================
     CARDS GRID
     ============================================================ -->
<main class="cases-grid" id="cases-grid">
  <!-- Cards injected by JS -->
</main>

<!-- ============================================================
     MODAL
     ============================================================ -->
<div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal" id="modal">
    <header class="modal__header">
      <button class="modal__close" id="modal-close" aria-label="關閉">×</button>
      <span class="modal__badge" id="modal-badge"></span>
      <h2 class="modal__title" id="modal-title"></h2>
      <div class="modal__tools" id="modal-tools"></div>
    </header>
    <div class="modal__body" id="modal-body">
      <!-- IPO sections injected by JS -->
    </div>
    <footer class="modal__footer">
      <span>案例編號：<span id="modal-id">—</span></span>
      <span>如需更新內容，請聯繫該案例負責單位</span>
    </footer>
  </div>
</div>

<script>
/* =====================================================================
   CASE DATA — 編輯此區即可更新案例內容，無需修改排版
   =====================================================================
   schema:
     id          : 卡片 URL slug（英文小寫，hash 用）
     bg          : 部門 / BG（卡片 badge）
     title       : Use Case 標題（卡片大字）
     tools       : 工具技術（卡片 + modal 副標）
     benefitsSummary : 卡片底部一句話效益
     painPoint   : 痛點與情境（modal 第 1 段）
     input       : 資料來源與格式（陣列）
     process     : 處理流程（陣列）
     output      : 產出形式（陣列）
     benefits    : 完整效益（陣列）
   ===================================================================== */

    ],

      "Python 腳本批次讀取多源資料來源",
      "VBA 巨集進行格式統一與會計科目自動對應",
      "校驗規則自動檢查（餘額對平、科目完整性、匯率套用）",
      "例外清單回拋給承辦同仁人工複核",
      "通過驗證的資料自動產生合併報表"
    ],
    output: [
      "280+ 份標準化財務報表（PDF + Excel）",
      "多公司合併 BS / IS / CF 報表",

    benefits: [
      "月節省人工作業時間 200+ 小時",
      "跨國 13 家公司資料 100% 準確",

      "會計人員從重複作業轉向分析工作"
    ]
  },
  {
    id: "hr",
    bg: "HR",
    title: "25+ 行政流程自動化（派車 / 總務 / 餐費對帳等）",
    tools: "Power Automate + GenAI 輔助",

      "對帳類流程：自動比對來源資料、差異標記"

  {
    id: "iibg-rd",

/* =====================================================================
   RENDER
   ===================================================================== */
const gridEl     = document.getElementById("cases-grid");
const filterBar  = document.getElementById("filter-bar");
const searchEl   = document.getElementById("search-input");
const metaCount  = document.getElementById("meta-count");

const state = {
  filter: "ALL",
  search: ""
};

function renderFilterChips() {
  const bgs = ["ALL", ...new Set(CASES.map(c => c.bg))];
  bgs.forEach(bg => {
    const chip = document.createElement("button");
    chip.className = "filter-chip" + (bg === "ALL" ? " is-active" : "");
    chip.textContent = bg === "ALL" ? "全部" : bg;
    chip.dataset.bg = bg;
    chip.onclick = () => {
      state.filter = bg;
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("is-active"));
      chip.classList.add("is-active");
      renderCards();
    };
    filterBar.insertBefore(chip, searchEl);
  });
}

function matchesFilter(c) {
  if (state.filter !== "ALL" && c.bg !== state.filter) return false;
  if (state.search) {
    const q = state.search.toLowerCase();
    const haystack = [c.bg, c.title, c.tools, c.benefitsSummary].join(" ").toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  return true;
}

function renderCards() {
  const visible = CASES.filter(matchesFilter);
  gridEl.innerHTML = "";

  metaCount.textContent = `案例總數：${visible.length} / ${CASES.length}`;

  if (visible.length === 0) {
    gridEl.innerHTML = '<div class="empty-state">沒有符合條件的案例</div>';
    return;
  }

  visible.forEach(c => {
    const card = document.createElement("button");
    card.className = "case-card";
    card.type = "button";
    card.setAttribute("aria-label", `查看 ${c.bg} ${c.title} 詳情`);
    card.innerHTML = `
      <div class="case-card__header">
        <span class="case-card__badge">${c.bg}</span>
        <span class="case-card__id">#${c.id.toUpperCase()}</span>
      </div>
      <h3 class="case-card__title">${c.title}</h3>
      <div class="case-card__row">
        <span class="case-card__row-label">Tools</span>
        <span class="case-card__row-value">${c.tools}</span>
      </div>
      <div class="case-card__benefits">
        <div class="case-card__benefits-label">效益亮點</div>
        <div class="case-card__benefits-value">${c.benefitsSummary}</div>
      </div>
      <span class="case-card__cta">查看完整 IPO →</span>
    `;
    card.onclick = () => openModal(c.id);
    gridEl.appendChild(card);
  });
}

/* =====================================================================
   MODAL
   ===================================================================== */
const backdrop = document.getElementById("modal-backdrop");
const closeBtn = document.getElementById("modal-close");

function openModal(id) {
  const c = CASES.find(x => x.id === id);
  if (!c) return;

  document.getElementById("modal-badge").textContent = c.bg;
  document.getElementById("modal-title").textContent = c.title;
  document.getElementById("modal-tools").textContent = c.tools;
  document.getElementById("modal-id").textContent = c.id.toUpperCase();

  const body = document.getElementById("modal-body");
  body.innerHTML = `
    ${renderSection("①", "痛點與情境", `<p>${c.painPoint}</p>`)}
    ${renderSection("②", "Input · 資料來源與格式", renderList(c.input))}
    ${renderSection("③", "Process · 處理流程", renderList(c.process))}
    ${renderSection("④", "Output · 產出形式", renderList(c.output))}
    ${renderSection("⑤", "Benefits · 實際效益", renderList(c.benefits), "benefits")}
  `;

  backdrop.classList.add("is-open");
  document.body.style.overflow = "hidden";
  history.replaceState(null, "", `#case=${c.id}`);
}

function renderSection(icon, title, content, variant = "") {
  return `
    <section class="ipo-section ${variant ? "ipo-section--" + variant : ""}">
      <div class="ipo-section__heading">
        <span class="ipo-section__icon">${icon}</span>
        <h4 class="ipo-section__title">${title}</h4>
      </div>
      <div class="ipo-section__body">${content}</div>
    </section>
  `;
}

function renderList(items) {
  return "<ul>" + items.map(i => `<li>${i}</li>`).join("") + "</ul>";
}

function closeModal() {
  backdrop.classList.remove("is-open");
  document.body.style.overflow = "";
  history.replaceState(null, "", window.location.pathname + window.location.search);
}

closeBtn.onclick = closeModal;
backdrop.onclick = e => { if (e.target === backdrop) closeModal(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && backdrop.classList.contains("is-open")) closeModal();
});

/* =====================================================================
   SEARCH
   ===================================================================== */
searchEl.addEventListener("input", () => {
  state.search = searchEl.value.trim();
  renderCards();
});

/* =====================================================================
   DEEP LINK (?case=hr or #case=hr)
   ===================================================================== */
function checkDeepLink() {
  const hash = window.location.hash.match(/case=([\w-]+)/);
  if (hash) openModal(hash[1]);
}

/* =====================================================================
   INIT
   ===================================================================== */
renderFilterChips();
renderCards();
checkDeepLink();
</script>
